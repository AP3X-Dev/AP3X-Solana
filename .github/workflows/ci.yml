name: CI

on:
  push:
    branches: [main, prp-*]
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:17 UTC nightly — avoids common on-the-hour GitHub-Actions contention.
    # Drives the nightly-diag job (surfaces RPC and pump.fun program drift).
    - cron: '17 5 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (package-boundary rules)
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test (unit + coverage enforcement)
        run: pnpm -r test:coverage

      - name: Verify Jito proto loads
        run: pnpm --filter @ap3x/solana-executor exec node -e 'import("./dist/proto/load.js").then((m) => m.loadSearcherProto())'

      # Substrate posture gate: none of the following may appear in the
      # resolved dependency graph. `pnpm why <pkg>` exits 0 and prints the
      # installers when a match is found, and prints nothing on exit 0 when
      # there is no match. We invert that: any line that mentions the
      # forbidden name is a failure. Runs in `shell: bash` so Windows uses
      # git-bash (available on GitHub-hosted windows-latest runners).
      - name: Verify no forbidden deps
        shell: bash
        run: |
          set -eo pipefail
          FORBIDDEN=(
            "@solana/web3.js"
            "@solana/kit"
            "@solana/spl-token"
            "@metaplex-foundation/js"
            "@metaplex-foundation/mpl-token-metadata"
            "@metaplex-foundation/umi"
          )
          failed=0
          for pkg in "${FORBIDDEN[@]}"; do
            if pnpm why "$pkg" 2>/dev/null | grep -F -q "$pkg"; then
              echo "::error::forbidden dependency found: $pkg"
              pnpm why "$pkg" || true
              failed=1
            else
              echo "ok: no trace of $pkg"
            fi
          done
          exit $failed

  # Nightly diagnostics against mainnet (see docs/diagnostics/README.md):
  #   1. Substrate RPC probe — the configured endpoint answers getSlot.
  #   2. pump.fun decoder coverage — fails when more than 10% of recent event
  #      payloads on either program decode as unknown (program upgrade).
  #   3. pump.fun live simulation — a buy built from on-chain state must be
  #      accepted by the deployed program (account/instruction drift).
  # Uses the SOLANA_RPC_URL secret when set, otherwise the public endpoint.
  # When this alarms, follow docs/runbook/pumpfun-fixture-refresh.md.
  nightly-diag:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: nightly-diag
    runs-on: ubuntu-latest
    env:
      RPC_URL: ${{ secrets.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Substrate RPC probe
        run: pnpm --filter @ap3x/solana-connectivity diag probe-rpc --url "$RPC_URL" --check

      - name: pump.fun decoder coverage
        run: pnpm --filter @ap3x/pumpfun-events run diag

      - name: pump.fun live simulation
        run: pnpm --filter @ap3x/pumpfun-protocol exec vitest run tests/live-simulation.test.ts
        env:
          AP3X_LIVE_RPC: ${{ env.RPC_URL }}

  # Runs the @ap3x/solana-webhooks Postgres outbox parity tests against a
  # service container, once per supported Postgres major. The same parity
  # suite runs against SQLite in the default `test` job — both backends
  # share the contract documented on the Outbox interface.
  webhooks-postgres-tests:
    name: webhooks-postgres-tests (PG ${{ matrix.pg-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg-version: [14, 15, 16]
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ap3x_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AP3X_PG_URL: postgres://postgres:postgres@localhost:5432/ap3x_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Postgres outbox parity (real DB)
        run: pnpm --filter @ap3x/solana-webhooks exec vitest run src/outbox/postgres-parity.test.ts --reporter=verbose

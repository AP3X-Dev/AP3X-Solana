name: CI

on:
  push:
    branches: [main, prp-*]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (package-boundary rules)
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test (unit + coverage)
        run: pnpm test

      # Substrate posture gate: none of the following may appear in the
      # resolved dependency graph. `pnpm why <pkg>` exits 0 and prints the
      # installers when a match is found, and prints nothing on exit 0 when
      # there is no match. We invert that: any line that mentions the
      # forbidden name is a failure. Runs in `shell: bash` so Windows uses
      # git-bash (available on GitHub-hosted windows-latest runners).
      - name: Verify no forbidden deps
        shell: bash
        run: |
          set -eo pipefail
          FORBIDDEN=(
            "@solana/web3.js"
            "@solana/kit"
            "@solana/spl-token"
            "@metaplex-foundation/js"
            "@metaplex-foundation/mpl-token-metadata"
            "@metaplex-foundation/umi"
          )
          failed=0
          for pkg in "${FORBIDDEN[@]}"; do
            if pnpm why "$pkg" 2>/dev/null | grep -F -q "$pkg"; then
              echo "::error::forbidden dependency found: $pkg"
              pnpm why "$pkg" || true
              failed=1
            else
              echo "ok: no trace of $pkg"
            fi
          done
          exit $failed
